spring:
  application:
    name: zone-service
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: zone
  datasource:
    url: jdbc:postgresql://localhost:5433/zone_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

server:
  port: 8084

logging:
  level:
    org.springdoc: DEBUG
    by.sustain.zoneservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-NO_REQUEST_ID}] %-5level %logger{36} - %msg%n"

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

