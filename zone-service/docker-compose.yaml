version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sustain-zone-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/zone.sql:/docker-entrypoint-initdb.d/zone.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sustain-network

volumes:
  postgres_data:

networks:
  sustain-network:
    driver: bridge
